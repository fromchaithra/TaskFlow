spring:
  datasource:
    url: jdbc:h2:mem:taskflow_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

taskflow:
  jwt:
    secret: VGFza0Zsb3dUZXN0U2VjcmV0S2V5Rm9ySlVuaXQ1VGVzdGluZzEyMzQ1Njc4OTA=
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
    cookie-name: tf_refresh
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origins: http://localhost:5173
  bootstrap:
    admin-email: ""
    admin-password: ""
  storage:
    provider: local
    local-dir: ./target/test-uploads
    max-file-size-bytes: 10485760
